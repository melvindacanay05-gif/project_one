<section class="mode">
                <p>mode</p>

                <button type="button" data-theme-choice="warm">ambient</button>
            </section>
    
<script>
document.addEventListener("DOMContentLoaded", function () {
    const themeButtons = document.querySelectorAll(
        ".mode button[data-theme-choice]"
    );
    const themes = ["light", "dark", "warm"];
    const savedTheme = localStorage.getItem("recipeStudioTheme");
    const initialTheme = themes.includes(savedTheme) ? savedTheme : "warm";

    function applyTheme(theme) {
        if (!themes.includes(theme)) return;

        document.body.setAttribute("data-theme", theme);
        localStorage.setItem("recipeStudioTheme", theme);

        themeButtons.forEach(function (button) {
            button.setAttribute(
                "aria-pressed",
                button.dataset.themeChoice === theme
            );
        });
    }

    themeButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            applyTheme(button.dataset.themeChoice);
        });
    });

    applyTheme(initialTheme);
});
</script>


    <script id="recipe-studio-theme-script">
    (function () {
        const savedTheme = localStorage.getItem("recipeStudioTheme") || "warm";
        document.documentElement.dataset.theme = savedTheme;

        document.querySelectorAll("[data-theme-choice]").forEach(function (button) {
            button.addEventListener("click", function () {
                const theme = button.dataset.themeChoice;
                document.documentElement.dataset.theme = theme;
                localStorage.setItem("recipeStudioTheme", theme);
            });
        });
    })();
    </script>
